services:
  server:
    build: .
    command: python server.py
    ports:
      - "8080:8080" # Flwr server port
      - "8081"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: server

  client:
    build: .
    command: python /app/client.py
    volumes:
      - data:/app/data
    depends_on:
      server:
        condition: service_healthy
    environment:
      - NUM_CLIENTS=${NUM_CLIENTS:-3}
      - COMPOSE_PROJECT_NAME=${container-aware-operating-system-support-for-federated-learning}
    ports:
      - "8000"

  manager:
    build: .
    command: python manager.py
    depends_on:
      - client
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  
  prometheus:
    image: prom/prometheus
    user: 'root'
    ports:
      - "9090:9090"
    volumes:
      # Mount our new config file into the container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # Mount the Docker socket (read-only)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
    - redis
  redis:
    image: redis:latest
    container_name: redis
    ports:
    - 6379:6379

volumes:
  data: